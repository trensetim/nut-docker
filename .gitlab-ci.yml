services:
    - name: docker:dind

before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build_image:
    tags:
        - docker
    script:
        # always build latest
        - PLATFORMS="linux/arm/v7,linux/arm64,linux/amd64"
        - docker buildx build --push --platform $PLATFORMS --tag $CI_REGISTRY/$CI_PROJECT_PATH .
        - docker buildx build --push --platform $PLATFORMS --tag $CI_REGISTRY/$CI_PROJECT_PATH:shutdown-orchestrator-latest .

        # build tagged images if commit is a git tag
        - |
            if [ ! -z "$CI_COMMIT_TAG" ] ; then
            docker tag $CI_REGISTRY/$CI_PROJECT_PATH $CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_TAG
            docker push $CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_TAG

            docker tag $CI_REGISTRY/$CI_PROJECT_PATH:shutdown-orchestrator-latest $CI_REGISTRY/$CI_PROJECT_PATH:shutdown-orchestrator-$CI_COMMIT_TAG
            docker push $CI_REGISTRY/$CI_PROJECT_PATH:shutdown-orchestrator-$CI_COMMIT_TAG
            fi
